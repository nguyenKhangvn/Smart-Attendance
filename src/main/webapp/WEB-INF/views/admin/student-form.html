<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head
    th:replace="~{admin/admin-common :: head(${student.id != null ? 'Chỉnh sửa học sinh' : 'Thêm học sinh'}, '/css/admin/student-form.css')}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{admin/admin-common :: sidebar('students')}"></div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 th:text="${student.id != null ? 'Chỉnh sửa học sinh' : 'Thêm học sinh mới'}">
                        <i class="fas fa-user-graduate me-2"></i>Thêm học sinh mới
                    </h2>
                    <a th:href="@{/admin/students}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Quay lại
                    </a>
                </div>

                <div class="card">
                    <div class="card-body">
                        <form
                            th:action="@{${student.id != null ? '/admin/students/update/' + student.id : '/admin/students/create'}}"
                            method="post" th:object="${student}">
                            <div class="row">
                                <!-- Student Code -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mã học sinh <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{studentCode}"
                                        placeholder="VD: 2024001" required>
                                </div>

                                <!-- Username -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{username}"
                                        placeholder="VD: nguyenvana" th:readonly="${student.id != null}" required>
                                </div>

                                <!-- Password (only on create) -->
                                <div class="col-md-6 mb-3" th:if="${student.id == null}">
                                    <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" name="password" placeholder="Mật khẩu"
                                        required>
                                </div>

                                <!-- Full Name -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{fullName}"
                                        placeholder="VD: Nguyễn Văn A" required>
                                </div>

                                <!-- Email -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" th:field="*{email}"
                                        placeholder="VD: student@example.com" required>
                                </div>

                                <!-- Phone Number -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="tel" class="form-control" th:field="*{phoneNumber}"
                                        placeholder="VD: 0123456789">
                                </div>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>
                                    <span th:text="${student.id != null ? 'Cập nhật' : 'Tạo mới'}">Tạo mới</span>
                                </button>
                                <a th:href="@{/admin/students}" class="btn btn-secondary ms-2">
                                    <i class="fas fa-times me-2"></i>Hủy bỏ
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/admin-common :: scripts(null)}"></div>
</body>

</html>
