<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết lớp học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin/class-detail.css}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 border-bottom">
                    <h5><i class="fas fa-shield-alt me-2"></i>Admin Panel</h5>
                </div>
                <nav class="nav flex-column">
                    <a th:href="@{/admin/dashboard}" class="nav-link">
                        <i class="fas fa-home me-2"></i>Dashboard
                    </a>
                    <a th:href="@{/admin/teachers}" class="nav-link">
                        <i class="fas fa-chalkboard-teacher me-2"></i>Quản lý Giáo viên
                    </a>
                    <a th:href="@{/admin/students}" class="nav-link">
                        <i class="fas fa-user-graduate me-2"></i>Quản lý Học sinh
                    </a>
                    <a th:href="@{/admin/classes}" class="nav-link active">
                        <i class="fas fa-school me-2"></i>Quản lý Lớp học
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-school me-2"></i>Chi tiết lớp học</h2>
                    <a th:href="@{/admin/classes}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Quay lại
                    </a>
                </div>

                <!-- Class Information -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>Thông tin lớp học</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="info-item">
                                    <span class="info-label">Mã lớp:</span>
                                    <span th:text="${classEntity.classCode}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Môn học:</span>
                                    <span th:text="${classEntity.subjectName}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Học kỳ:</span>
                                    <span class="badge bg-info" th:text="${classEntity.semester}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="info-item">
                                    <span class="info-label">Giáo viên:</span>
                                    <span th:text="${classEntity.teacher.fullName}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Lịch học:</span>
                                    <span th:text="${classEntity.scheduleInfo}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Trạng thái:</span>
                                    <span th:if="${classEntity.isActive}" class="badge bg-success">
                                        <i class="fas fa-check-circle me-1"></i>Hoạt động
                                    </span>
                                    <span th:unless="${classEntity.isActive}" class="badge bg-secondary">
                                        <i class="fas fa-ban me-1"></i>Tạm dừng
                                    </span>
                                </div>
                            </div>
                            <div class="col-12" th:if="${classEntity.description}">
                                <div class="info-item mt-3">
                                    <span class="info-label">Mô tả:</span>
                                    <p th:text="${classEntity.description}" class="mt-2 mb-0"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Students List -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-users me-2"></i>Danh sách học sinh
                            <span class="badge bg-primary" th:text="${students.size()}"></span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>Mã học sinh</th>
                                        <th>Tên đăng nhập</th>
                                        <th>Họ tên</th>
                                        <th>Email</th>
                                        <th>Số điện thoại</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${students.empty}">
                                        <td colspan="6" class="text-center text-muted">
                                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                                            Chưa có học sinh nào
                                        </td>
                                    </tr>
                                    <tr th:each="student, iterStat : ${students}">
                                        <td th:text="${iterStat.count}"></td>
                                        <td><strong th:text="${student.studentCode}"></strong></td>
                                        <td th:text="${student.username}"></td>
                                        <td th:text="${student.fullName}"></td>
                                        <td th:text="${student.email}"></td>
                                        <td th:text="${student.phoneNumber}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
