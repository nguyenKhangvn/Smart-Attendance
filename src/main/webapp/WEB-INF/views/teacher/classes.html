<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách lớp học - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-book me-2"></i>Danh sách Lớp Học</h2>
            <a th:href="@{/teacher/classes/create}" class="btn btn-primary">
                <i class="fas fa-plus me-2"></i>Tạo lớp mới
            </a>
        </div>

        <!-- Alert Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Classes List -->
        <div class="row">
            <div th:if="${classes.isEmpty()}" class="col-12">
                <div class="card text-center py-5">
                    <div class="card-body">
                        <i class="fas fa-inbox fa-4x text-muted mb-3"></i>
                        <h4 class="text-muted">Chưa có lớp học nào</h4>
                        <p class="text-muted">Hãy tạo lớp học đầu tiên của bạn!</p>
                        <a th:href="@{/teacher/classes/create}" class="btn btn-primary">
                            <i class="fas fa-plus me-2"></i>Tạo lớp học
                        </a>
                    </div>
                </div>
            </div>

            <div th:unless="${classes.isEmpty()}" th:each="classEntity : ${classes}" class="col-md-6 col-lg-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-book me-2"></i>
                            <span th:text="${classEntity.classCode}">CS101</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <h6 class="card-title" th:text="${classEntity.subjectName}">Lập trình hướng đối tượng</h6>
                        <p class="card-text text-muted">
                            <i class="fas fa-calendar me-2"></i>
                            <span th:text="${classEntity.semester}">HK1 2024-2025</span>
                        </p>
                        <p class="card-text" th:if="${classEntity.scheduleInfo}">
                            <i class="fas fa-clock me-2"></i>
                            <span th:text="${classEntity.scheduleInfo}">Thứ 2, 7:00 - 9:00</span>
                        </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-secondary">
                                <i class="fas fa-users me-1"></i>
                                <span th:text="${classEntity.students.size()}">0</span> sinh viên
                            </span>
                            <span th:if="${classEntity.isActive}" class="badge bg-success">
                                <i class="fas fa-check-circle me-1"></i>Hoạt động
                            </span>
                            <span th:unless="${classEntity.isActive}" class="badge bg-secondary">
                                <i class="fas fa-ban me-1"></i>Tạm dừng
                            </span>
                        </div>
                    </div>
                    <div class="card-footer bg-light">
                        <div class="d-flex gap-2">
                            <a th:href="@{/teacher/classes/{id}(id=${classEntity.id})}"
                                class="btn btn-sm btn-primary flex-fill">
                                <i class="fas fa-eye me-1"></i>Chi tiết
                            </a>
                            <a th:href="@{/teacher/classes/{id}/edit(id=${classEntity.id})}"
                                class="btn btn-sm btn-warning">
                                <i class="fas fa-edit"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
