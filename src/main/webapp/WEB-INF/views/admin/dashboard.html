<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/admin-common :: head('Dashboard', '/css/admin/dashboard.css')}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{admin/admin-common :: sidebar('dashboard')}"></div>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Dashboard</h1>
                </div>

                <!-- Stats Cards -->
                <div class="row mb-4">
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Giáo Viên</h6>
                                        <h3 class="mb-0" th:text="${teacherCount}">0</h3>
                                    </div>
                                    <div class="text-primary">
                                        <i class="fas fa-chalkboard-teacher fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card" style="border-left-color: #28a745;">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Học Sinh</h6>
                                        <h3 class="mb-0" th:text="${studentCount}">0</h3>
                                    </div>
                                    <div class="text-success">
                                        <i class="fas fa-user-graduate fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card" style="border-left-color: #ffc107;">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Lớp học</h6>
                                        <h3 class="mb-0" th:text="${classCount}">0</h3>
                                    </div>
                                    <div class="text-warning">
                                        <i class="fas fa-school fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card" style="border-left-color: #17a2b8;">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Tổng Users</h6>
                                        <h3 class="mb-0" th:text="${teacherCount + studentCount}">0</h3>
                                    </div>
                                    <div class="text-info">
                                        <i class="fas fa-users fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0"><i class="fas fa-bolt me-2"></i>Thao tác nhanh</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/admin/teachers/create}"
                                            class="btn btn-outline-primary w-100 py-3">
                                            <i class="fas fa-user-plus fa-2x d-block mb-2"></i>
                                            Thêm Giáo Viên
                                        </a>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/admin/students/create}"
                                            class="btn btn-outline-success w-100 py-3">
                                            <i class="fas fa-user-graduate fa-2x d-block mb-2"></i>
                                            Thêm Học Sinh
                                        </a>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/admin/classes/create}"
                                            class="btn btn-outline-warning w-100 py-3">
                                            <i class="fas fa-school fa-2x d-block mb-2"></i>
                                            Tạo Lớp học
                                        </a>
                                    </div>
                                </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
    </main>
    </div>
    </div>

    <div th:replace="~{admin/admin-common :: scripts(null)}"></div>
</body>

</html>
