<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan QR Code - Smart Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link th:href="@{/css/student/scan-qr.css}" rel="stylesheet" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
  <div th:replace="~{layout :: navbar}"></div>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
              <i class="fas fa-qrcode"></i> Quét mã QR điểm danh
            </h4>
          </div>
          <div class="card-body">
            <!-- QR Scanner -->
            <div id="reader" class="mb-4"></div>

            <!-- Camera Preview -->
            <div class="text-center mb-3">
              <h5>Chụp ảnh selfie</h5>
              <video id="preview" autoplay playsinline></video>
              <canvas id="canvas" style="display: none"></canvas>
            </div>

            <!-- Result -->
            <div id="result" class="alert" style="display: none"></div>

            <!-- Permission Request Button (hidden by default) -->
            <div id="permissionSection" class="text-center mb-3" style="display: none">
              <button id="requestPermissionsBtn" class="btn btn-primary">
                <i class="fas fa-unlock"></i> Yêu cầu quyền Camera & GPS
              </button>
            </div>

            <!-- Instructions -->
            <div class="alert alert-info">
              <h6><i class="fas fa-info-circle"></i> Hướng dẫn:</h6>
              <ol class="mb-0">
                <li>Di chuyển camera để quét mã QR từ màn hình</li>
                <li>Hệ thống sẽ tự động chụp ảnh selfie từ camera trước</li>
                <li>Đảm bảo bạn đang ở trong lớp học (kiểm tra GPS)</li>
                <li>Chờ kết quả điểm danh</li>
              </ol>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/student/scan-qr.js}"></script>
</body>

</html>
