<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Chi tiết lớp học - Sinh viên</title>
    <!-- Page specific CSS -->
    <link th:href="@{/resources/css/student/class-detail.css}" rel="stylesheet">
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid py-4">
            <!-- Class Info Card -->
            <div class="card mb-4 info-card">
                <div class="card-header text-white">
                    <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i> Thông tin lớp học</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="info-item">
                                <strong>Mã lớp:</strong> <span th:text="${classEntity.classCode}"></span>
                            </div>
                            <div class="info-item">
                                <strong>Môn học:</strong> <span th:text="${classEntity.subjectName}"></span>
                            </div>
                            <div class="info-item">
                                <strong>Học kỳ:</strong> <span th:text="${classEntity.semester}"></span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-item">
                                <strong>Giảng viên:</strong> <span th:text="${classEntity.teacher.fullName}"></span>
                            </div>
                            <div class="info-item">
                                <strong>Email GV:</strong> <span th:text="${classEntity.teacher.email}"></span>
                            </div>
                            <div class="info-item">
                                <strong>Lịch học:</strong> <span th:text="${classEntity.scheduleInfo}"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3" th:if="${classEntity.description}">
                        <div class="col-12">
                            <div class="info-item">
                                <strong>Mô tả:</strong> <span th:text="${classEntity.description}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
