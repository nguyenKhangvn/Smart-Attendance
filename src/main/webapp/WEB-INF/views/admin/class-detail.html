<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/admin-common :: head('Chi tiết lớp học', '/css/admin/class-detail.css')}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{admin/admin-common :: sidebar('classes')}"></div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-school me-2"></i>Chi tiết lớp học</h2>
                    <a th:href="@{/admin/classes}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Quay lại
                    </a>
                </div>

                <!-- ALERT MESSAGES -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Class Information -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>Thông tin lớp học</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="info-item">
                                    <span class="info-label">Mã lớp:</span>
                                    <span th:text="${classEntity.classCode}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Môn học:</span>
                                    <span th:text="${classEntity.subjectName}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Học kỳ:</span>
                                    <span class="badge bg-info" th:text="${classEntity.semester}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="info-item">
                                    <span class="info-label">Giáo viên:</span>
                                    <span th:text="${classEntity.teacher.fullName}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Lịch học:</span>
                                    <span th:text="${classEntity.scheduleInfo}"></span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Trạng thái:</span>
                                    <span th:if="${classEntity.isActive}" class="badge bg-success">
                                        <i class="fas fa-check-circle me-1"></i>Hoạt động
                                    </span>
                                    <span th:unless="${classEntity.isActive}" class="badge bg-secondary">
                                        <i class="fas fa-ban me-1"></i>Tạm dừng
                                    </span>
                                </div>
                            </div>
                            <div class="col-12" th:if="${classEntity.description}">
                                <div class="info-item mt-3">
                                    <span class="info-label">Mô tả:</span>
                                    <p th:text="${classEntity.description}" class="mt-2 mb-0"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Student Form -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-user-plus me-2"></i>Thêm học sinh vào lớp</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/classes/{id}/add-student(id=${classEntity.id})}" method="post"
                            class="row g-3">
                            <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                            <div class="col-md-8">
                                <label class="form-label">Chọn học sinh</label>
                                <select name="studentId" class="form-select" required>
                                    <option value="">-- Chọn học sinh --</option>
                                    <option th:each="student : ${availableStudents}" th:value="${student.id}"
                                        th:text="${student.studentCode + ' - ' + student.fullName}"></option>
                                </select>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="fas fa-plus me-2"></i>Thêm vào lớp
                                </button>
                            </div>
                        </form>
                        <div th:if="${availableStudents.empty}" class="text-muted mt-2">
                            <i class="fas fa-info-circle me-1"></i>Không có học sinh nào khả dụng để thêm.
                        </div>
                    </div>
                </div>

                <!-- Students List -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-users me-2"></i>Danh sách học sinh
                            <span class="badge bg-primary" th:text="${students.size()}"></span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>Mã học sinh</th>
                                        <th>Tên đăng nhập</th>
                                        <th>Họ tên</th>
                                        <th>Email</th>
                                        <th>Số điện thoại</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${students.empty}">
                                        <td colspan="7" class="text-center text-muted">
                                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                                            Chưa có học sinh nào
                                        </td>
                                    </tr>
                                    <tr th:each="student, iterStat : ${students}">
                                        <td th:text="${iterStat.count}"></td>
                                        <td><strong th:text="${student.studentCode}"></strong></td>
                                        <td th:text="${student.username}"></td>
                                        <td th:text="${student.fullName}"></td>
                                        <td th:text="${student.email}"></td>
                                        <td th:text="${student.phoneNumber}"></td>
                                        <td>
                                            <form
                                                th:action="@{/admin/classes/{classId}/remove-student/{studentId}(classId=${classEntity.id}, studentId=${student.id})}"
                                                method="post" class="d-inline"
                                                onsubmit="return confirm('Bạn có chắc muốn xóa học sinh ' + '${student.fullName}' + ' khỏi lớp?');">
                                                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                                <button type="submit" class="btn btn-danger btn-sm"
                                                    title="Xóa khỏi lớp">
                                                    <i class="fas fa-user-minus"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/admin-common :: scripts(null)}"></div>
</body>

</html>
