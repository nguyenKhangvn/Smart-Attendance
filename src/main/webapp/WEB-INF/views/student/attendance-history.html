<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Lịch sử điểm danh - Sinh viên</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Lịch sử điểm danh</h2>
                    <p class="text-muted">Xem lại toàn bộ lịch sử điểm danh của bạn</p>
                </div>
                <div>
                    <button class="btn btn-success" onclick="exportToExcel()">
                        <i class="fas fa-file-excel"></i> Xuất Excel
                    </button>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card border-primary">
                        <div class="card-body text-center">
                            <h3 class="text-primary mb-2" th:text="${records.size()}">0</h3>
                            <p class="text-muted mb-0">Tổng buổi học</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-success">
                        <div class="card-body text-center">
                            <h3 class="text-success mb-2" th:text="${#lists.size(records.?[status == 'PRESENT'])}">0
                            </h3>
                            <p class="text-muted mb-0">Có mặt</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-warning">
                        <div class="card-body text-center">
                            <h3 class="text-warning mb-2" th:text="${#lists.size(records.?[status == 'LATE'])}">0</h3>
                            <p class="text-muted mb-0">Đi muộn</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-danger">
                        <div class="card-body text-center">
                            <h3 class="text-danger mb-2" th:text="${#lists.size(records.?[status == 'ABSENT'])}">0</h3>
                            <p class="text-muted mb-0">Vắng</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Attendance Records -->
            <div class="card">
                <div class="card-header bg-light">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="fas fa-list"></i> Chi tiết điểm danh</h5>
                        <div>
                            <input type="text" id="searchInput" class="form-control form-control-sm"
                                placeholder="Tìm kiếm...">
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="attendanceTable">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Ngày</th>
                                    <th>Mã lớp</th>
                                    <th>Môn học</th>
                                    <th>Buổi học</th>
                                    <th>Giờ điểm danh</th>
                                    <th>Trạng thái</th>
                                    <th>IP Address</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="record, iterStat : ${records}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${#temporals.format(record.checkInTime, 'dd/MM/yyyy')}">01/01/2024</td>
                                    <td th:text="${record.session.classEntity.classCode}">CS101</td>
                                    <td th:text="${record.session.classEntity.subjectName}">Subject</td>
                                    <td th:text="${record.session.sessionName}">Session</td>
                                    <td th:text="${#temporals.format(record.checkInTime, 'HH:mm:ss')}">10:00:00</td>
                                    <td>
                                        <span th:if="${record.status == 'PRESENT'}" class="badge bg-success">
                                            <i class="fas fa-check"></i> Có mặt
                                        </span>
                                        <span th:if="${record.status == 'LATE'}" class="badge bg-warning">
                                            <i class="fas fa-clock"></i> Muộn
                                        </span>
                                        <span th:if="${record.status == 'ABSENT'}" class="badge bg-danger">
                                            <i class="fas fa-times"></i> Vắng
                                        </span>
                                    </td>
                                    <td th:text="${record.ipAddress ?: '--'}">--</td>
                                </tr>
                                <tr th:if="${records.isEmpty()}">
                                    <td colspan="8" class="text-center text-muted">Chưa có dữ liệu điểm danh</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/student/attendance-history.js}"></script>
    </th:block>
</body>

</html>
