<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/admin-common :: head('Quản lý Giáo Viên', null)}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- SIDEBAR -->
            <div th:replace="admin/admin-common :: sidebar('teachers')"></div>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-chalkboard-teacher me-2"></i>Quản lý Giáo Viên</h1>
                    <a th:href="@{/admin/teachers/create}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Thêm Giáo Viên
                    </a>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Teachers Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>
                                            <a
                                                th:href="@{/admin/teachers(page=${currentPage}, size=${pageSize}, sortBy='id', sortDir=${sortBy == 'id' && sortDir == 'asc' ? 'desc' : 'asc'})}">
                                                ID <i
                                                    th:class="${sortBy == 'id' ? (sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'}"></i>
                                            </a>
                                        </th>
                                        <th>
                                            <a
                                                th:href="@{/admin/teachers(page=${currentPage}, size=${pageSize}, sortBy='username', sortDir=${sortBy == 'username' && sortDir == 'asc' ? 'desc' : 'asc'})}">
                                                Username <i
                                                    th:class="${sortBy == 'username' ? (sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'}"></i>
                                            </a>
                                        </th>
                                        <th>
                                            <a
                                                th:href="@{/admin/teachers(page=${currentPage}, size=${pageSize}, sortBy='fullName', sortDir=${sortBy == 'fullName' && sortDir == 'asc' ? 'desc' : 'asc'})}">
                                                Họ tên <i
                                                    th:class="${sortBy == 'fullName' ? (sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'}"></i>
                                            </a>
                                        </th>
                                        <th>
                                            <a
                                                th:href="@{/admin/teachers(page=${currentPage}, size=${pageSize}, sortBy='email', sortDir=${sortBy == 'email' && sortDir == 'asc' ? 'desc' : 'asc'})}">
                                                Email <i
                                                    th:class="${sortBy == 'email' ? (sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'}"></i>
                                            </a>
                                        </th>
                                        <th>SĐT</th>
                                        <th>Trạng thái</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="teacher : ${teacherPage.content}">
                                        <td th:text="${teacher.id}"></td>
                                        <td><strong th:text="${teacher.username}"></strong></td>
                                        <td th:text="${teacher.fullName}"></td>
                                        <td th:text="${teacher.email}"></td>
                                        <td th:text="${teacher.phoneNumber}"></td>
                                        <td>
                                            <span th:if="${teacher.isActive}" class="badge bg-success">
                                                <i class="fas fa-check-circle"></i> Hoạt động
                                            </span>
                                            <span th:unless="${teacher.isActive}" class="badge bg-secondary">
                                                <i class="fas fa-ban"></i> Vô hiệu
                                            </span>
                                        </td>
                                        <td>
                                            <div class="d-flex gap-1">
                                                <a th:href="@{/admin/teachers/edit/{id}(id=${teacher.id})}"
                                                    class="btn btn-warning btn-sm" title="Chỉnh sửa">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form
                                                    th:action="@{/admin/teachers/toggle-status/{id}(id=${teacher.id})}"
                                                    method="post" class="d-inline">
                                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                                    <button type="submit"
                                                        th:class="${teacher.isActive ? 'btn btn-secondary btn-sm' : 'btn btn-success btn-sm'}"
                                                        th:title="${teacher.isActive ? 'Vô hiệu hóa' : 'Kích hoạt'}">
                                                        <i
                                                            th:class="${teacher.isActive ? 'fas fa-ban' : 'fas fa-check'}"></i>
                                                    </button>
                                                </form>
                                                <button class="btn btn-danger btn-sm"
                                                    th:attr="data-id=${teacher.id},data-name=${teacher.fullName}"
                                                    onclick="confirmDelete(this)" title="Xóa">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${teacherPage.empty}">
                                        <td colspan="7" class="text-center text-muted">
                                            <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                                            Chưa có giáo viên nào
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div th:if="${!teacherPage.empty}"
                            th:replace="admin/admin-common :: pagination(${teacherPage}, '/admin/teachers')"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="deleteForm" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                    <div class="modal-header">
                        <h5 class="modal-title">Xác nhận xóa</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        Bạn có chắc chắn muốn xóa <strong id="teacherName"></strong>?
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button class="btn btn-danger" type="submit">Xóa</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{admin/admin-common :: scripts(null)}"></div>

    <script>
        function confirmDelete(button) {
            const teacherId = button.getAttribute('data-id');
            const teacherName = button.getAttribute('data-name');

            document.getElementById('teacherName').textContent = teacherName;
            document.getElementById('deleteForm').action = '/admin/teachers/delete/' + teacherId;

            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }
    </script>
</body>

</html>
