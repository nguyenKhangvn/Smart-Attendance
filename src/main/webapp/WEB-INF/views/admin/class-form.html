<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head
    th:replace="~{admin/admin-common :: head(${classEntity.id != null ? 'Chỉnh sửa lớp học' : 'Thêm lớp học'}, '/css/admin/class-form.css')}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{admin/admin-common :: sidebar('classes')}"></div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 th:text="${classEntity.id != null ? 'Chỉnh sửa lớp học' : 'Thêm lớp học mới'}">
                        <i class="fas fa-school me-2"></i>Thêm lớp học mới
                    </h2>
                    <a th:href="@{/admin/classes}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Quay lại
                    </a>
                </div>

                <div class="card">
                    <div class="card-body">
                        <form
                            th:action="@{${classEntity.id != null ? '/admin/classes/update/' + classEntity.id : '/admin/classes/create'}}"
                            method="post" th:object="${classEntity}">
                            <div class="row">
                                <!-- Class Code -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mã lớp <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{classCode}"
                                        placeholder="VD: CS101" required>
                                </div>

                                <!-- Subject Name -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tên môn học <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{subjectName}"
                                        placeholder="VD: Lập trình Java" required>
                                </div>

                                <!-- Semester -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Học kỳ <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" th:field="*{semester}"
                                        placeholder="VD: HK1 2023-2024" required>
                                </div>

                                <!-- Teacher (only on create) -->
                                <div class="col-md-6 mb-3" th:if="${classEntity.id == null}">
                                    <label class="form-label">Giáo viên phụ trách <span
                                            class="text-danger">*</span></label>
                                    <select class="form-select" name="teacherId" required>
                                        <option value="">-- Chọn giáo viên --</option>
                                        <option th:each="teacher : ${teachers}" th:value="${teacher.id}"
                                            th:text="${teacher.fullName + ' (' + teacher.username + ')'}">
                                        </option>
                                    </select>
                                </div>

                                <!-- Teacher (readonly on edit) -->
                                <div class="col-md-6 mb-3" th:if="${classEntity.id != null}">
                                    <label class="form-label">Giáo viên phụ trách</label>
                                    <input type="text" class="form-control"
                                        th:value="${classEntity.teacher.fullName + ' (' + classEntity.teacher.username + ')'}"
                                        readonly>
                                    <small class="text-muted">Không thể thay đổi giáo viên sau khi tạo</small>
                                </div>

                                <!-- Schedule Info -->
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Thông tin lịch học</label>
                                    <input type="text" class="form-control" th:field="*{scheduleInfo}"
                                        placeholder="VD: Thứ 2, 7:00 - 9:00">
                                </div>

                                <!-- Description -->
                                <div class="col-12 mb-3">
                                    <label class="form-label">Mô tả</label>
                                    <textarea class="form-control" th:field="*{description}" rows="3"
                                        placeholder="Mô tả chi tiết về lớp học"></textarea>
                                </div>

                                <!-- Active Status (only on edit) -->
                                <div class="col-12 mb-3" th:if="${classEntity.id != null}">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{isActive}"
                                            id="isActive">
                                        <label class="form-check-label" for="isActive">
                                            Lớp đang hoạt động
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>
                                    <span th:text="${classEntity.id != null ? 'Cập nhật' : 'Tạo mới'}">Tạo mới</span>
                                </button>
                                <a th:href="@{/admin/classes}" class="btn btn-secondary ms-2">
                                    <i class="fas fa-times me-2"></i>Hủy bỏ
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/admin-common :: scripts(null)}"></div>
</body>

</html>
