<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code - Smart Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link th:href="@{/css/teacher/qr-scanner.css}" rel="stylesheet" />
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="qr-container">
          <h2 class="mb-4"><i class="fas fa-qrcode"></i> Mã QR Điểm Danh</h2>
          <h4 th:text="${classSession.sessionName}">Session Name</h4>
          <p class="text-muted" th:text="${classSession.classEntity.subjectName}">
            Class Name
          </p>

          <div id="qrCode" class="mb-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div class="mb-4">
            <p class="mb-2">Thời gian còn lại:</p>
            <div class="timer" id="timer">05:00</div>
          </div>

          <div class="alert alert-info">
            <i class="fas fa-info-circle"></i>
            Sinh viên hãy quét mã QR này để điểm danh. Mã QR sẽ tự động hết
            hạn sau 5 phút.
          </div>

          <div class="mt-4">
            <!-- Nút bắt đầu session nếu chưa bắt đầu -->
            <form th:if="${classSession.status.name() != 'IN_PROGRESS'}"
              th:action="@{/teacher/sessions/{id}/start(id=${classSession.id})}" method="post" style="display: inline;">
              <button type="submit" class="btn btn-warning btn-lg me-2">
                <i class="fas fa-play"></i> Bắt đầu buổi học
              </button>
            </form>

            <button class="btn btn-primary btn-lg" id="regenerateBtn">
              <i class="fas fa-sync"></i> Tạo mã mới
            </button>
            <a th:href="@{/teacher/sessions/{id}/attendance(id=${classSession.id})}" class="btn btn-success btn-lg">
              <i class="fas fa-list-check"></i> Xem điểm danh
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:inline="javascript">
    const sessionId = /*[[${classSession.id}]]*/ 0;
  </script>
  <script th:src="@{/js/teacher/qr-scanner.js}"></script>
</body>

</html>
