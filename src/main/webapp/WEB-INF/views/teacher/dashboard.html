<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Teacher Dashboard - Smart Attendance</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
            rel="stylesheet"
    />
</head>

<body>
<div th:replace="~{layout :: navbar}"></div>

<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h2 class="mb-4">
                Dashboard Giáo Viên
            </h2>
            <p class="lead">
                Chào mừng,
                <strong th:text="${teacher.fullName}">Teacher Name</strong>!
            </p>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row mt-4">
        <div class="col-md-4 mb-3">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6 class="text-uppercase">Tổng số lớp</h6>
                            <h2 th:text="${classes.size()}">0</h2>
                        </div>
                        <div>
                            <i class="fas fa-book fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6 class="text-uppercase">Buổi học hôm nay</h6>
                            <h2 th:text="${todaySessions}">0</h2>
                        </div>
                        <div>
                            <i class="fas fa-calendar-day fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h6 class="text-uppercase">Sinh viên</h6>
                            <h2 th:text="${totalStudents}">0</h2>
                        </div>
                        <div>
                            <i class="fas fa-users fa-3x opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Classes List with Card Layout -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div
                        class="card-header bg-white d-flex justify-content-between align-items-center"
                >
                    <h5 class="mb-0">
                        Danh sách lớp học
                    </h5>
                    <a th:href="@{/teacher/classes/create}" class="btn btn-primary">
                      Tạo lớp mới
                    </a>
                </div>
                <div class="card-body">
                    <!-- Empty State -->
                    <div th:if="${classes.isEmpty()}" class="text-center py-5">
                        <h5 class="text-muted">Chưa có lớp học nào</h5>
                        <p class="text-muted">Hãy tạo lớp học đầu tiên của bạn!</p>
                        <a th:href="@{/teacher/classes/create}" class="btn btn-primary">

                            </i>Tạo lớp học
                        </a>
                    </div>

                    <!-- Classes Grid -->
                    <div th:unless="${classes.isEmpty()}" class="row">
                        <div
                                th:each="classEntity : ${classes}"
                                class="col-md-6 col-lg-4 mb-4"
                        >
                            <div class="card h-100 shadow-sm border">
                                <div class="card-header bg-primary text-white">
                                    <h6 class="mb-0">
                                        <span th:text="${classEntity.classCode}">CS101</span>
                                    </h6>
                                </div>
                                <div class="card-body">
                                    <h6
                                            class="card-title"
                                            th:text="${classEntity.subjectName}"
                                    >
                                        Lập trình hướng đối tượng
                                    </h6>
                                    <p class="card-text text-muted mb-2">
                        <span th:text="${classEntity.semester}"
                        >HK1 2024-2025</span
                        >
                                    </p>
                                    <p
                                            class="card-text mb-3"
                                            th:if="${classEntity.scheduleInfo}"
                                    >
                                        <small th:text="${classEntity.scheduleInfo}"
                                        >Thứ 2, 7:00 - 9:00</small
                                        >
                                    </p>
                                    <div
                                            class="d-flex justify-content-between align-items-center"
                                    >
                        <span class="badge bg-info">
                          <span th:text="${classEntity.students.size()}"
                          >0</span
                          >
                          SV
                        </span>
                                        <span
                                                th:if="${classEntity.isActive}"
                                                class="badge bg-success"
                                        >
                            Hoạt động
                        </span>
                                        <span
                                                th:unless="${classEntity.isActive}"
                                                class="badge bg-secondary"
                                        >
                          Tạm dừng
                        </span>
                                    </div>
                                </div>
                                <div class="card-footer bg-light">
                                    <div class="d-flex gap-2 justify-content-between">
                                        <a
                                                th:href="@{/teacher/classes/{id}(id=${classEntity.id})}"
                                                class="btn btn-sm btn-primary"
                                        >
                                            </i>Chi tiết
                                        </a>
                                        <a
                                                th:href="@{/teacher/sessions/create(classId=${classEntity.id})}"
                                                class="btn btn-sm btn-success"
                                                title="Tạo buổi học"
                                        >
                                            <i class="fas fa-calendar-plus"></i>
                                        </a>
                                        <a
                                                th:href="@{/teacher/classes/{id}/edit(id=${classEntity.id})}"
                                                class="btn btn-sm btn-warning"
                                                title="Sửa"
                                        >
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
