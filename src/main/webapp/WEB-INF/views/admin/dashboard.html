<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/admin/dashboard.css}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-md-block sidebar p-0">
                <div class="position-sticky">
                    <div class="text-center text-white py-4">
                        <i class="fas fa-user-shield fa-3x mb-2"></i>
                        <h5>Admin Panel</h5>
                    </div>
                    <ul class="nav flex-column px-3">
                        <li class="nav-item mb-2">
                            <a class="nav-link active rounded" th:href="@{/admin/dashboard}">
                                <i class="fas fa-home me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link rounded" th:href="@{/admin/teachers}">
                                <i class="fas fa-chalkboard-teacher me-2"></i> Quản lý Giáo Viên
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link rounded" th:href="@{/admin/students}">
                                <i class="fas fa-user-graduate me-2"></i> Quản lý Học Sinh
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link rounded" th:href="@{/admin/classes}">
                                <i class="fas fa-school me-2"></i> Quản lý Lớp học
                            </a>
                        </li>
                        <li class="nav-item mb-2 mt-5">
                            <a class="nav-link rounded" th:href="@{/logout}">
                                <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Dashboard</h1>
                </div>

                <!-- Stats Cards -->
                <div class="row mb-4">
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Giáo Viên</h6>
                                        <h3 class="mb-0" th:text="${teacherCount}">0</h3>
                                    </div>
                                    <div class="text-primary">
                                        <i class="fas fa-chalkboard-teacher fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card" style="border-left-color: #28a745;">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Học Sinh</h6>
                                        <h3 class="mb-0" th:text="${studentCount}">0</h3>
                                    </div>
                                    <div class="text-success">
                                        <i class="fas fa-user-graduate fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card" style="border-left-color: #ffc107;">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Lớp học</h6>
                                        <h3 class="mb-0" th:text="${classCount}">0</h3>
                                    </div>
                                    <div class="text-warning">
                                        <i class="fas fa-school fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card stat-card" style="border-left-color: #17a2b8;">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-muted mb-2">Tổng Users</h6>
                                        <h3 class="mb-0" th:text="${teacherCount + studentCount}">0</h3>
                                    </div>
                                    <div class="text-info">
                                        <i class="fas fa-users fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0"><i class="fas fa-bolt me-2"></i>Thao tác nhanh</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/admin/teachers/create}"
                                            class="btn btn-outline-primary w-100 py-3">
                                            <i class="fas fa-user-plus fa-2x d-block mb-2"></i>
                                            Thêm Giáo Viên
                                        </a>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/admin/students/create}"
                                            class="btn btn-outline-success w-100 py-3">
                                            <i class="fas fa-user-graduate fa-2x d-block mb-2"></i>
                                            Thêm Học Sinh
                                        </a>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <a th:href="@{/admin/classes/create}"
                                            class="btn btn-outline-warning w-100 py-3">
                                            <i class="fas fa-school fa-2x d-block mb-2"></i>
                                            Tạo Lớp học
                                        </a>
                                    </div>
                                </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
    </main>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
