<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title, customCss)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title : 'Smart Attendance Admin'}">Smart Attendance Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/resources/css/style.css}" rel="stylesheet">
    <link th:if="${customCss}" th:href="@{${customCss}}" rel="stylesheet">
</head>

<body>
    <!-- ADMIN SIDEBAR FRAGMENT -->
    <nav th:fragment="sidebar(activePage)" class="col-md-2 sidebar text-white"
        style="min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2)">
        <div class="p-3 text-center">
            <i class="fas fa-user-shield fa-3x"></i>
            <h5 class="mt-2">Admin Panel</h5>
        </div>

        <ul class="nav flex-column px-3">
            <li class="nav-item">
                <a class="nav-link text-white" th:classappend="${activePage == 'dashboard'} ? 'active' : ''"
                    th:style="${activePage == 'dashboard'} ? 'background:rgba(255,255,255,0.2)' : ''"
                    th:href="@{/admin/dashboard}">
                    <i class="fas fa-home me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" th:classappend="${activePage == 'teachers'} ? 'active' : ''"
                    th:style="${activePage == 'teachers'} ? 'background:rgba(255,255,255,0.2)' : ''"
                    th:href="@{/admin/teachers}">
                    <i class="fas fa-chalkboard-teacher me-2"></i>Giáo viên
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" th:classappend="${activePage == 'students'} ? 'active' : ''"
                    th:style="${activePage == 'students'} ? 'background:rgba(255,255,255,0.2)' : ''"
                    th:href="@{/admin/students}">
                    <i class="fas fa-user-graduate me-2"></i>Học sinh
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" th:classappend="${activePage == 'classes'} ? 'active' : ''"
                    th:style="${activePage == 'classes'} ? 'background:rgba(255,255,255,0.2)' : ''"
                    th:href="@{/admin/classes}">
                    <i class="fas fa-school me-2"></i>Lớp học
                </a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-white" th:href="@{/logout}">
                    <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                </a>
            </li>
        </ul>
    </nav>

    <!-- Pagination Component -->
    <div th:fragment="pagination(page, baseUrl)" class="d-flex justify-content-between align-items-center mt-3">
        <!-- Page Size Selector -->
        <div class="d-flex align-items-center">
            <label class="me-2">Show:</label>
            <select class="form-select form-select-sm" style="width: auto;" onchange="changePageSize(this.value)">
                <option th:value="5" th:selected="${pageSize == 5}">5</option>
                <option th:value="10" th:selected="${pageSize == 10}">10</option>
                <option th:value="25" th:selected="${pageSize == 25}">25</option>
                <option th:value="50" th:selected="${pageSize == 50}">50</option>
            </select>
            <span class="ms-2">entries</span>
        </div>

        <!-- Pagination Info -->
        <div>
            <span
                th:text="'Showing ' + ${page.number * page.size + 1} + ' to ' + ${page.number * page.size + page.numberOfElements} + ' of ' + ${page.totalElements} + ' entries'"></span>
        </div>

        <!-- Pagination Controls -->
        <nav aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                <!-- Previous Button -->
                <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
                    <a class="page-link"
                        th:href="${page.hasPrevious()} ? @{${baseUrl}(page=${page.number - 1}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir})} : '#'"
                        th:aria-disabled="${!page.hasPrevious()}">
                        Previous
                    </a>
                </li>

                <!-- Page Numbers -->
                <li th:each="pageNum : ${#numbers.sequence(0, page.totalPages - 1)}" class="page-item"
                    th:classappend="${pageNum == page.number} ? 'active' : ''">
                    <a class="page-link"
                        th:href="@{${baseUrl}(page=${pageNum}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir})}"
                        th:text="${pageNum + 1}">1</a>
                </li>

                <!-- Next Button -->
                <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
                    <a class="page-link"
                        th:href="${page.hasNext()} ? @{${baseUrl}(page=${page.number + 1}, size=${pageSize}, sortBy=${sortBy}, sortDir=${sortDir})} : '#'"
                        th:aria-disabled="${!page.hasNext()}">
                        Next
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Scripts -->
    <div th:fragment="scripts(customJs)">
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Custom JS -->
        <script th:src="@{/resources/js/common.js}"></script>
        <script th:if="${customJs}" th:src="@{${customJs}}"></script>

        <script th:inline="javascript">
            /*<![CDATA[*/
            function changePageSize(newSize) {
                const url = new URL(window.location);
                url.searchParams.set('size', newSize);
                url.searchParams.set('page', '0'); // Reset to first page
                window.location.href = url.toString();
            }

            function changeSort(sortBy, currentSortDir) {
                const url = new URL(window.location);
                url.searchParams.set('sortBy', sortBy);
                url.searchParams.set('sortDir', currentSortDir === 'asc' ? 'desc' : 'asc');
                url.searchParams.set('page', '0'); // Reset to first page
                window.location.href = url.toString();
            }
            /*]]>*/
        </script>
    </div>
</body>

</html>
