<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head
    th:replace="~{admin/admin-common :: head(${teacher.id == null ? 'Thêm Giáo Viên' : 'Chỉnh sửa Giáo Viên'}, '/css/admin/teacher-form.css')}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{admin/admin-common :: sidebar('teachers')}"></div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 th:text="${teacher.id == null ? 'Thêm Giáo Viên Mới' : 'Chỉnh sửa Giáo Viên'}">
                        <i class="fas fa-chalkboard-teacher me-2"></i>Thêm Giáo Viên Mới
                    </h2>
                    <a th:href="@{/admin/teachers}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Quay lại
                    </a>
                </div>

                <div class="card shadow">
                    <div class="card-body">
                        <form
                            th:action="@{${teacher.id == null ? '/admin/teachers/create' : '/admin/teachers/update/' + teacher.id}}"
                            th:object="${teacher}" method="post">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Username <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{username}" class="form-control"
                                        th:readonly="${teacher.id != null}" required>
                                </div>
                                <div class="col-md-6" th:if="${teacher.id == null}">
                                    <label class="form-label">Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{password}" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{fullName}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" th:field="*{phoneNumber}" class="form-control">
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/admin/teachers}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>
                                    <span th:text="${teacher.id == null ? 'Tạo mới' : 'Cập nhật'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/admin-common :: scripts(null)}"></div>
</body>

</html>
