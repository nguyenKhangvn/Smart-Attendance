<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Lớp học của tôi - Sinh viên</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Lớp học của tôi</h2>
                    <p class="text-muted">Danh sách các lớp học bạn đang tham gia</p>
                </div>
                <div>
                    <a th:href="@{/student/scan-qr}" class="btn btn-primary">
                        <i class="fas fa-qrcode"></i> Điểm danh QR
                    </a>
                </div>
            </div>

            <!-- Alert Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Classes Grid -->
            <div class="row" th:if="${!classes.isEmpty()}">
                <div class="col-md-6 col-lg-4 mb-4" th:each="class : ${classes}">
                    <div class="card h-100 shadow-sm hover-shadow">
                        <div class="card-header bg-gradient-primary text-white">
                            <h5 class="mb-0" th:text="${class.classCode}">CS101</h5>
                        </div>
                        <div class="card-body">
                            <h6 class="card-title text-primary mb-3" th:text="${class.subjectName}">Subject Name</h6>

                            <div class="mb-3">
                                <p class="mb-1"><strong><i class="fas fa-user-tie"></i> Giảng viên:</strong></p>
                                <p class="ms-3 mb-0" th:text="${class.teacher.fullName}">Teacher Name</p>
                            </div>

                            <div class="mb-3">
                                <p class="mb-1"><strong><i class="fas fa-calendar"></i> Lịch học:</strong></p>
                                <p class="ms-3 mb-0" th:text="${class.scheduleInfo}">Schedule</p>
                            </div>

                            <div class="mb-3">
                                <p class="mb-1"><strong><i class="fas fa-book"></i> Học kỳ:</strong></p>
                                <p class="ms-3 mb-0" th:text="${class.semester}">Semester</p>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <span class="badge bg-info">
                                    <i class="fas fa-users"></i> <span th:text="${class.students.size()}">0</span> sinh
                                    viên
                                </span>
                                <span th:if="${class.isActive}" class="badge bg-success">
                                    <i class="fas fa-check-circle"></i> Đang hoạt động
                                </span>
                                <span th:unless="${class.isActive}" class="badge bg-secondary">
                                    <i class="fas fa-pause-circle"></i> Tạm dừng
                                </span>
                            </div>
                        </div>
                        <div class="card-footer bg-light">
                            <a th:href="@{/student/classes/{id}(id=${class.id})}" class="btn btn-sm btn-primary w-100">
                                <i class="fas fa-eye"></i> Xem chi tiết
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${classes.isEmpty()}" class="text-center py-5">
                <i class="fas fa-inbox fa-4x text-muted mb-3"></i>
                <h4 class="text-muted">Bạn chưa tham gia lớp học nào</h4>
                <p class="text-muted">Liên hệ với giảng viên để được thêm vào lớp học</p>
            </div>
        </div>
    </div>

    <th:block layout:fragment="styles">
        <link th:href="@{/css/student/classes.css}" rel="stylesheet">
    </th:block>
</body>

</html>
