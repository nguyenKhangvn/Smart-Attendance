<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/admin-common :: head('Quản lý Lớp học', null)}">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div th:replace="~{admin/admin-common :: sidebar('classes')}"></div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-school me-2"></i>Quản lý Lớp học</h2>
                    <a th:href="@{/admin/classes/create}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Tạo lớp mới
                    </a>
                </div>

                <!-- Alert Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>
                                            <a
                                                th:href="@{/admin/classes(page=${currentPage}, size=${pageSize}, sortBy='classCode', sortDir=${sortBy == 'classCode' && sortDir == 'asc' ? 'desc' : 'asc'})}">
                                                Mã lớp <i
                                                    th:class="${sortBy == 'classCode' ? (sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'}"></i>
                                            </a>
                                        </th>
                                        <th>
                                            <a
                                                th:href="@{/admin/classes(page=${currentPage}, size=${pageSize}, sortBy='subjectName', sortDir=${sortBy == 'subjectName' && sortDir == 'asc' ? 'desc' : 'asc'})}">
                                                Môn học <i
                                                    th:class="${sortBy == 'subjectName' ? (sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'}"></i>
                                            </a>
                                        </th>
                                        <th>Giáo viên</th>
                                        <th>
                                            <a
                                                th:href="@{/admin/classes(page=${currentPage}, size=${pageSize}, sortBy='semester', sortDir=${sortBy == 'semester' && sortDir == 'asc' ? 'desc' : 'asc'})}">
                                                Học kỳ <i
                                                    th:class="${sortBy == 'semester' ? (sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down') : 'fas fa-sort'}"></i>
                                            </a>
                                        </th>
                                        <th>Số học sinh</th>
                                        <th>Trạng thái</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="classEntity : ${classPage.content}">
                                        <td>
                                            <strong th:text="${classEntity.classCode}"></strong>
                                        </td>
                                        <td th:text="${classEntity.subjectName}"></td>
                                        <td>
                                            <i class="fas fa-user-tie me-1"></i>
                                            <span th:text="${classEntity.teacher.fullName}"></span>
                                        </td>
                                        <td>
                                            <span class="badge bg-info" th:text="${classEntity.semester}"></span>
                                        </td>
                                        <td>
                                            <span class="badge bg-secondary">
                                                <i class="fas fa-users me-1"></i>
                                                <span th:text="${studentCounts[classEntity.id]}"></span>
                                            </span>
                                        </td>
                                        <td>
                                            <span th:if="${classEntity.isActive}" class="badge bg-success">
                                                <i class="fas fa-check-circle me-1"></i>Hoạt động
                                            </span>
                                            <span th:unless="${classEntity.isActive}" class="badge bg-secondary">
                                                <i class="fas fa-ban me-1"></i>Tạm dừng
                                            </span>
                                        </td>
                                        <td>
                                            <div class="d-flex gap-1">
                                                <a th:href="@{/admin/classes/detail/{id}(id=${classEntity.id})}"
                                                    class="btn btn-info btn-sm" title="Chi tiết">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                                <a th:href="@{/admin/classes/edit/{id}(id=${classEntity.id})}"
                                                    class="btn btn-warning btn-sm" title="Sửa">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form
                                                    th:action="@{/admin/classes/toggle-status/{id}(id=${classEntity.id})}"
                                                    method="post" class="d-inline">
                                                    <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                                                    <button type="submit"
                                                        th:class="${classEntity.isActive ? 'btn btn-secondary btn-sm' : 'btn btn-success btn-sm'}"
                                                        th:title="${classEntity.isActive ? 'Tạm dừng' : 'Kích hoạt'}">
                                                        <i
                                                            th:class="${classEntity.isActive ? 'fas fa-pause' : 'fas fa-play'}"></i>
                                                    </button>
                                                </form>
                                                <button type="button" class="btn btn-danger btn-sm"
                                                    th:attr="data-class-id=${classEntity.id},data-class-name=${classEntity.classCode}"
                                                    onclick="confirmDelete(this)" title="Xóa">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${classPage.empty}">
                                        <td colspan="7" class="text-center text-muted">
                                            <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                                            Chưa có lớp học nào
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div th:if="${!classPage.empty}"
                            th:replace="~{admin/admin-common :: pagination(${classPage}, '/admin/classes')}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Xác nhận xóa</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Bạn có chắc chắn muốn xóa lớp <strong id="deleteClassName"></strong>?</p>
                    <p class="text-danger"><i class="fas fa-exclamation-triangle me-2"></i>Hành động này không thể hoàn
                        tác!</p>
                </div>
                <div class="modal-footer">
                    <form id="deleteForm" method="post" th:action="@{/admin/classes/delete/__ID__}">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-danger">Xóa</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{admin/admin-common :: scripts(null)}"></div>

    <script>
        function confirmDelete(button) {
            const classId = button.getAttribute('data-class-id');
            const className = button.getAttribute('data-class-name');

            document.getElementById('deleteClassName').textContent = className;
            document.getElementById('deleteForm').setAttribute('action', '/admin/classes/delete/' + classId);

            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }
    </script>
