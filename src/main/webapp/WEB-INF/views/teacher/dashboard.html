<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Smart Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="mb-4">
                    <i class="fas fa-chalkboard-teacher"></i> Dashboard Giáo Viên
                </h2>
                <p class="lead">Chào mừng, <strong th:text="${teacher.fullName}">Teacher Name</strong>!</p>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="row mt-4">
            <div class="col-md-4 mb-3">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-uppercase">Tổng số lớp</h6>
                                <h2 th:text="${classes.size()}">0</h2>
                            </div>
                            <div>
                                <i class="fas fa-book fa-3x opacity-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-uppercase">Buổi học hôm nay</h6>
                                <h2 th:text="${todaySessions}">0</h2>
                            </div>
                            <div>
                                <i class="fas fa-calendar-day fa-3x opacity-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-info text-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="text-uppercase">Sinh viên</h6>
                                <h2 th:text="${totalStudents}">0</h2>
                            </div>
                            <div>
                                <i class="fas fa-users fa-3x opacity-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Classes List -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-list"></i> Danh sách lớp học
                        </h5>
                        <a th:href="@{/teacher/classes/create}" class="btn btn-primary">
                            <i class="fas fa-plus"></i> Tạo lớp mới
                        </a>
                    </div>
                    <div class="card-body">
                        <div th:if="${classes.isEmpty()}" class="text-center py-5 text-muted">
                            <i class="fas fa-inbox fa-3x mb-3"></i>
                            <p>Chưa có lớp học nào. Hãy tạo lớp học đầu tiên!</p>
                        </div>
                        <div th:unless="${classes.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Mã lớp</th>
                                        <th>Tên môn học</th>
                                        <th>Học kỳ</th>
                                        <th>Số sinh viên</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="class : ${classes}">
                                        <td th:text="${class.classCode}">CS101</td>
                                        <td th:text="${class.subjectName}">Introduction to Programming</td>
                                        <td th:text="${class.semester}">HK1 2024-2025</td>
                                        <td>
                                            <span class="badge bg-info" th:text="${class.students.size()}">0</span>
                                        </td>
                                        <td>
                                            <a th:href="@{/teacher/classes/{id}(id=${class.id})}"
                                                class="btn btn-sm btn-primary">
                                                <i class="fas fa-eye"></i> Xem
                                            </a>
                                            <a th:href="@{/teacher/sessions/create(classId=${class.id})}"
                                                class="btn btn-sm btn-success">
                                                <i class="fas fa-calendar-plus"></i> Tạo buổi học
                                            </a>
                                            <a th:href="@{/teacher/classes/{id}/edit(id=${class.id})}"
                                                class="btn btn-sm btn-warning">
                                                <i class="fas fa-edit"></i> Sửa
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>
</body>

</html>
