<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${teacher.id == null ? 'Thêm Giáo Viên' : 'Chỉnh sửa Giáo Viên'}">Form Giáo Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/admin/teacher-form.css}" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-plus me-2"></i>
                            <span th:text="${teacher.id == null ? 'Thêm Giáo Viên Mới' : 'Chỉnh sửa Giáo Viên'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form
                            th:action="@{${teacher.id == null ? '/admin/teachers/create' : '/admin/teachers/update/' + teacher.id}}"
                            th:object="${teacher}" method="post">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Username <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{username}" class="form-control"
                                        th:readonly="${teacher.id != null}" required>
                                </div>
                                <div class="col-md-6" th:if="${teacher.id == null}">
                                    <label class="form-label">Password <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{password}" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{fullName}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" th:field="*{phoneNumber}" class="form-control">
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/admin/teachers}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Quay lại
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>
                                    <span th:text="${teacher.id == null ? 'Tạo mới' : 'Cập nhật'}"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
