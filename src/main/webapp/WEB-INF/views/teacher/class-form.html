<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo lớp học mới</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{layout :: navbar}"></div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-md-8 offset-md-2">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>
              <i class="fas fa-book me-2"></i>
              <span
                th:text="${classEntity.id != null ? 'Chỉnh sửa lớp học' : 'Tạo lớp học mới'}"
                >Tạo lớp học mới</span
              >
            </h2>
            <a th:href="@{/teacher/classes}" class="btn btn-secondary">
              <i class="fas fa-arrow-left me-2"></i>Quay lại
            </a>
          </div>

          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">
                <i class="fas fa-info-circle me-2"></i>Thông tin lớp học
              </h5>
            </div>
            <div class="card-body">
              <!-- Error Alert -->
              <div
                th:if="${error}"
                class="alert alert-danger alert-dismissible fade show"
                role="alert"
              >
                <i class="fas fa-exclamation-triangle me-2"></i>
                <strong>Lỗi!</strong> <span th:text="${error}"></span>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="alert"
                  aria-label="Close"
                ></button>
              </div>

              <form
                th:action="@{${classEntity.id != null ? '/teacher/classes/' + classEntity.id + '/edit' : '/teacher/classes/create'}}"
                method="post"
                th:object="${classEntity}"
              >
                <div class="mb-3">
                  <label class="form-label">
                    <i class="fas fa-code me-2"></i>Mã lớp
                    <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{classCode}"
                    placeholder="VD: CS101"
                    required
                  />
                  <small class="form-text text-muted"
                    >Mã định danh duy nhất cho lớp học</small
                  >
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    <i class="fas fa-book-open me-2"></i>Tên môn học
                    <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{subjectName}"
                    placeholder="VD: Lập trình hướng đối tượng"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    <i class="fas fa-calendar-alt me-2"></i>Học kỳ
                    <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{semester}"
                    placeholder="VD: HK1 2024-2025"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    <i class="fas fa-clock me-2"></i>Lịch học
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    th:field="*{scheduleInfo}"
                    placeholder="VD: Thứ 2, 7:00 - 9:00"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">
                    <i class="fas fa-sticky-note me-2"></i>Mô tả
                  </label>
                  <textarea
                    class="form-control"
                    th:field="*{description}"
                    rows="3"
                    placeholder="Mô tả chi tiết về lớp học"
                  ></textarea>
                </div>

                <div class="mb-3" th:if="${classEntity.id != null}">
                  <div class="form-check form-switch">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      th:field="*{isActive}"
                      id="isActive"
                    />
                    <label class="form-check-label" for="isActive">
                      Lớp đang hoạt động
                    </label>
                  </div>
                </div>

                <div class="alert alert-info">
                  <i class="fas fa-info-circle me-2"></i>
                  <strong>Lưu ý:</strong> Sau khi tạo lớp học, bạn có thể thêm
                  sinh viên và tạo các buổi học.
                </div>

                <div class="d-flex justify-content-end gap-2">
                  <a th:href="@{/teacher/classes}" class="btn btn-secondary">
                    <i class="fas fa-times me-2"></i>Hủy
                  </a>
                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>
                    <span
                      th:text="${classEntity.id != null ? 'Cập nhật' : 'Tạo mới'}"
                      >Tạo mới</span
                    >
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
