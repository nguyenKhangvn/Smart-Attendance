<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Giáo Viên - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/admin/teachers.css}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Include sidebar from dashboard -->
            <nav class="col-md-2 d-md-block sidebar p-0"
                style="min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <div class="position-sticky">
                    <div class="text-center text-white py-4">
                        <i class="fas fa-user-shield fa-3x mb-2"></i>
                        <h5>Admin Panel</h5>
                    </div>
                    <ul class="nav flex-column px-3">
                        <li class="nav-item mb-2">
                            <a class="nav-link rounded text-white-50" th:href="@{/admin/dashboard}"
                                style="color: rgba(255,255,255,0.8);">
                                <i class="fas fa-home me-2"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link active rounded text-white" th:href="@{/admin/teachers}"
                                style="background: rgba(255,255,255,0.2);">
                                <i class="fas fa-chalkboard-teacher me-2"></i> Quản lý Giáo Viên
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link rounded text-white-50" th:href="@{/admin/students}"
                                style="color: rgba(255,255,255,0.8);">
                                <i class="fas fa-user-graduate me-2"></i> Quản lý Học Sinh
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link rounded text-white-50" th:href="@{/admin/classes}"
                                style="color: rgba(255,255,255,0.8);">
                                <i class="fas fa-school me-2"></i> Quản lý Lớp học
                            </a>
                        </li>
                        <li class="nav-item mb-2 mt-5">
                            <a class="nav-link rounded text-white-50" th:href="@{/logout}"
                                style="color: rgba(255,255,255,0.8);">
                                <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2"><i class="fas fa-chalkboard-teacher me-2"></i>Quản lý Giáo Viên</h1>
                    <a th:href="@{/admin/teachers/create}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Thêm Giáo Viên
                    </a>
                </div>

                <!-- Alerts -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Teachers Table -->
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Username</th>
                                        <th>Họ tên</th>
                                        <th>Email</th>
                                        <th>SĐT</th>
                                        <th>Trạng thái</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="teacher : ${teachers}">
                                        <td th:text="${teacher.id}"></td>
                                        <td><strong th:text="${teacher.username}"></strong></td>
                                        <td th:text="${teacher.fullName}"></td>
                                        <td th:text="${teacher.email}"></td>
                                        <td th:text="${teacher.phoneNumber}"></td>
                                        <td>
                                            <span th:if="${teacher.isActive}" class="badge bg-success">
                                                <i class="fas fa-check-circle"></i> Hoạt động
                                            </span>
                                            <span th:unless="${teacher.isActive}" class="badge bg-secondary">
                                                <i class="fas fa-ban"></i> Vô hiệu
                                            </span>
                                        </td>
                                        <td>
                                            <div class="btn-group btn-group-sm">
                                                <a th:href="@{/admin/teachers/edit/{id}(id=${teacher.id})}"
                                                    class="btn btn-outline-primary" title="Chỉnh sửa">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <form
                                                    th:action="@{/admin/teachers/toggle-status/{id}(id=${teacher.id})}"
                                                    method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-outline-warning"
                                                        th:title="${teacher.isActive ? 'Vô hiệu hóa' : 'Kích hoạt'}">
                                                        <i
                                                            th:class="${teacher.isActive ? 'fas fa-ban' : 'fas fa-check'}"></i>
                                                    </button>
                                                </form>
                                                <form th:action="@{/admin/teachers/delete/{id}(id=${teacher.id})}"
                                                    method="post" style="display: inline;"
                                                    onsubmit="return confirm('Bạn có chắc muốn xóa giáo viên này?');">
                                                    <button type="submit" class="btn btn-outline-danger" title="Xóa">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(teachers)}">
                                        <td colspan="7" class="text-center text-muted">
                                            <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                                            Chưa có giáo viên nào
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
